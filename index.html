<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kinematics Study Lab</title>
<style>
:root{
  --ink:#16213a; --paper:#eef3f9; --grid:#d9e4f0; --blue:#2f6fed; --yellow:#ffd23f;
  --green:#1f9d6a; --red:#d8472f; --amber:#e8a317; --muted:#56667f; --white:#fff;
  --display:"Avenir Next","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --body:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; color:var(--ink); font-family:var(--body); font-size:17px; line-height:1.5;
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:28px 28px;
}
.top{
  position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between; gap:10px;
  padding:10px 16px; background:var(--ink); color:#fff;
}
.brand{background:none;border:0;color:#fff;font:800 1.05rem var(--display);cursor:pointer;padding:6px 4px;display:flex;align-items:center;gap:8px}
.brand .paw{font-size:1.25rem}
.top nav{display:flex;gap:8px}
.tbtn{background:transparent;color:#fff;border:2px solid #fff;border-radius:10px;padding:6px 12px;font:700 .9rem var(--body);cursor:pointer}
.tbtn:hover{background:#fff;color:var(--ink)}
main{max-width:800px;margin:0 auto;padding:22px 16px 90px}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0 0 .4em;letter-spacing:-.01em}
h1{font-size:clamp(2.1rem,7vw,3.3rem);font-weight:800}
.h1s{font-size:clamp(1.7rem,5vw,2.3rem);font-weight:800}
h2{font-size:1.3rem;font-weight:800} h3{font-size:1.1rem;font-weight:800}
.sec{margin:28px 0 12px}
.lede{font-size:1.1rem;max-width:62ch;margin:.2em 0 1.2em}
.hero{padding:18px 0 8px}
.muted{color:var(--muted)} .center{text-align:center;justify-content:center}
.card{background:var(--white);border:2px solid var(--ink);border-radius:14px;box-shadow:5px 5px 0 var(--ink);padding:18px;margin:0 0 22px}
.card p{margin:.2em 0 .8em}
.grid3{display:grid;gap:18px;grid-template-columns:1fr;margin-bottom:22px}
.grid3 .card{margin:0;display:flex;flex-direction:column}
.grid3 .card .row{margin-top:auto}
@media(min-width:720px){.grid3{grid-template-columns:repeat(3,1fr)}}
.row{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0}
.row.grow input{flex:1 1 220px}
.btn{
  font:700 1rem var(--body); color:var(--ink); background:#fff; border:2px solid var(--ink); border-radius:10px;
  padding:10px 16px; min-height:44px; cursor:pointer; box-shadow:3px 3px 0 var(--ink); text-align:center; line-height:1.2;
}
.btn small{font-weight:500;color:var(--muted)}
.btn:hover:not(:disabled){transform:translate(-1px,-1px);box-shadow:4px 4px 0 var(--ink)}
.btn:active:not(:disabled){transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn.primary{background:var(--yellow)}
.btn.primary small{color:var(--ink)}
.btn.ghost{background:transparent;box-shadow:none;border-style:dashed}
.btn:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.linkbtn{background:none;border:0;color:var(--blue);font:600 .95rem var(--body);text-decoration:underline;cursor:pointer;padding:6px 0}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}

/* running-track lanes */
.lanes{padding:8px 16px}
.lane{display:grid;grid-template-columns:1fr;gap:6px;padding:12px 0;border-bottom:2px dashed var(--grid)}
.lane:last-child{border-bottom:0}
@media(min-width:640px){.lane{grid-template-columns:230px 1fr 150px;align-items:center;gap:14px}}
.lane-name{font-weight:700;display:flex;gap:8px;align-items:center}
.lane-name input{width:20px;height:20px;flex:none;accent-color:var(--ink)}
.track{position:relative;height:26px;border:2px solid var(--ink);border-radius:13px;background:repeating-linear-gradient(90deg,#fff 0 18px,#f0f5fb 18px 20px);overflow:visible}
.track .fill{position:absolute;left:0;top:0;bottom:0;border-radius:11px 0 0 11px;transition:width .5s}
.fill.needs{background:var(--red)} .fill.almost{background:var(--amber)} .fill.ready{background:var(--green)} .fill.new{background:#c7d2e0}
.runner{position:absolute;top:-3px;font-size:1.05rem;transform:translateX(-8px)}
.flag{position:absolute;right:-4px;top:-14px;font-size:1.1rem}
.lane-status{display:flex;gap:6px;flex-wrap:wrap}
.pill{font:700 .78rem var(--body);padding:3px 9px;border-radius:99px;border:2px solid var(--ink);background:#fff}
.pill.needs{background:#ffd9d2} .pill.almost{background:#ffefc2} .pill.ready{background:#c9f0dd} .pill.blind{background:var(--yellow)}

/* question view */
.qhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin:0 0 12px}
.chip{background:var(--yellow);border:2px solid var(--ink);border-radius:8px;padding:3px 10px;font-weight:800;font-size:.9rem}
.lvl{font-size:.9rem;font-weight:700;color:var(--muted)}
.counter{margin-left:auto;font-weight:700;font-size:.9rem;color:var(--muted)}
.bar{height:10px;border:2px solid var(--ink);border-radius:6px;background:#fff;margin:0 0 14px;overflow:hidden}
.bar div{height:100%;background:var(--blue)}
.q .stem{font-size:1.18rem;line-height:1.5;margin-bottom:12px}
.tag{display:inline-block;background:var(--ink);color:#fff;border-radius:6px;padding:0 8px;font-size:.8rem;font-weight:700;margin-right:6px}
.gwrap{margin:8px 0 16px}
.graph{width:100%;max-width:560px;height:auto;display:block;border:2px solid var(--ink);border-radius:8px;background:#fff}
.mini{width:100%;max-width:150px;height:auto;display:block;margin-top:6px}
.mini-wrap .mini{max-width:230px;border:2px solid var(--ink);border-radius:8px;margin:10px 0}
table.data{border-collapse:collapse;margin:12px 0}
table.data th,table.data td{border:2px solid var(--ink);padding:5px 16px;text-align:center}
table.data th{background:var(--yellow)}
.opts{display:grid;gap:10px;margin:8px 0 12px}
.opts:has(.hasimg){grid-template-columns:repeat(2,1fr)}
@media(min-width:620px){.opts:has(.hasimg){grid-template-columns:repeat(4,1fr)}}
.opt{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--ink);border-radius:10px;padding:10px 12px;cursor:pointer;background:#fff}
.opt:hover{background:#f3f7ff}
.opt:has(input:checked){background:#e4edff;box-shadow:inset 0 0 0 2px var(--blue)}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt:has(input:focus-visible){outline:3px solid var(--blue);outline-offset:2px}
.opt .key{flex:none;width:26px;height:26px;border:2px solid var(--ink);border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:.85rem;background:#fff}
.opt .optbody{flex:1;min-width:0}
.opt.right{background:#d4f3e3;border-color:var(--green);box-shadow:inset 0 0 0 2px var(--green)}
.opt.wrong{background:#ffdcd5;border-color:var(--red);box-shadow:inset 0 0 0 2px var(--red)}
.numrow{display:flex;align-items:center;gap:10px;margin:8px 0 2px}
.numrow input{font:700 1.4rem var(--body);width:15ch;max-width:50%;padding:8px 12px;border:2px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink)}
.unit{font-weight:800;font-size:1.15rem}
.note{font-size:.9rem;color:var(--muted);margin:2px 0 10px}
.err{color:var(--red);font-weight:700}
input[type=text]{font:600 1rem var(--body);padding:10px 12px;border:2px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink);min-width:0}
.hints{display:grid;gap:8px;margin:6px 0 12px}
.hint{background:#fff8d6;border:2px solid var(--ink);border-radius:10px;padding:8px 12px;font-size:.98rem}
.actions{margin-top:12px}
.conf{background:#f3f7ff;border:2px solid var(--ink);border-radius:12px;padding:12px 14px;margin-top:12px}
.conf p{margin:0 0 8px}
.fb{border:2px solid var(--ink);border-radius:12px;padding:12px 14px;margin-top:14px}
.fb.good{background:#d4f3e3} .fb.bad{background:#ffe9e4} .fb.show{background:#e4edff}
.fb p{margin:0 0 6px}
.steps ol{margin:6px 0 0;padding-left:1.3em} .steps li{margin:3px 0}
.levelmsg{margin-top:10px;font-weight:800;background:var(--yellow);border:2px solid var(--ink);border-radius:10px;padding:8px 12px}

.codebox .code{font:800 clamp(1rem,4.5vw,1.45rem) ui-monospace,Menlo,Consolas,monospace;background:var(--paper);border:2px dashed var(--ink);border-radius:10px;padding:12px;margin:10px 0;text-align:center;word-break:break-all;user-select:all}
.loadbox .msg{min-height:0;color:var(--red);font-weight:700;margin:4px 0 0}
.note.card,.card.note{background:#fff8d6}

/* calculator */
#calc{position:fixed;right:14px;bottom:14px;width:min(270px,calc(100vw - 28px));z-index:30;background:var(--ink);color:#fff;border-radius:16px;padding:12px;box-shadow:5px 5px 0 rgba(22,33,58,.35);border:2px solid #fff}
#calc[hidden]{display:none}
.calc-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.calc-x{background:none;border:0;color:#fff;font-size:1.5rem;cursor:pointer;line-height:1;padding:0 6px}
.calc-expr{min-height:1.2em;text-align:right;color:#aab8d0;font-size:.85rem}
.calc-disp{font:700 2rem ui-monospace,Menlo,Consolas,monospace;text-align:right;background:#0f1830;border-radius:8px;padding:6px 10px;margin-bottom:10px;overflow:hidden;white-space:nowrap}
.calc-keys{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}
.ck{font:700 1.25rem var(--body);padding:11px 0;border-radius:10px;border:0;background:#2a3a5e;color:#fff;cursor:pointer}
.ck:hover{background:#3a4d78} .ck.op{background:var(--blue)} .ck.eq{background:var(--yellow);color:var(--ink)} .ck.zero{grid-column:span 2}
.ck.zero{grid-column:span 2}

#toast{position:fixed;left:50%;bottom:22px;transform:translate(-50%,30px);opacity:0;background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;font-weight:700;z-index:50;pointer-events:none;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

/* leave room so the calculator never covers the question */
body.calc-open main{padding-bottom:400px}
@media(min-width:1100px){body.calc-open main{padding-bottom:90px}}

.kindtag{background:#fff;border:2px solid var(--ink);border-radius:8px;padding:2px 9px;font-weight:700;font-size:.85rem}
.kindfilter{background:#fff8d6;padding:12px 16px}.kindfilter .row{margin:6px 0 0}.kchk{display:flex;gap:8px;align-items:center;font-weight:600;cursor:pointer}.kchk input{width:20px;height:20px;accent-color:var(--ink)}

</style>
</head>
<body>
<header class="top">
  <button class="brand" id="brand" aria-label="Kinematics Study Lab home"><span class="paw" aria-hidden="true">&#128062;</span>Kinematics Study Lab</button>
  <nav aria-label="Tools">
    <button class="tbtn" id="progbtn">My progress</button>
    <button class="tbtn" id="calcbtn" aria-expanded="false" aria-controls="calc">Calculator</button>
  </nav>
</header>
<main id="app"></main>
<div id="calc" role="dialog" aria-label="Calculator" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script>
'use strict';
/* ======================================================================
   Kinematics Study Lab — question bank
   Every question is generated from a template with fresh numbers/names.
   Numeric answers are always whole numbers or .5.
   NONE of these templates reuse a question from the Unit 1 Test.
   ====================================================================== */

const STUDENTS = ["Alex Brooks","David Adams","James Murray","Cyrus Ahmed","Reid Galluzzo","Peter Lee",
"Dilan Martiradonna","Stanley Ma","John Frankle","Quentin Mollenkamp","Reid DeMasi","Alec Cattie-Watt",
"Ben Evans","Cam David","Dean Carlson","Alex Bersh","Rafay Kharal","Viaan Ramnath",
"Julien Berg","Jeeva Kaushik","Max Fernaine","Chad Valerio","Ammar Qaiser","Matthew Schwartz",
"Jamie Greene","Preston Zarnegar","Dylan Metovic","Dean Haines","Henry Yoon","Masen Caver",
"Bode Simpson","Alden Skelton","William Flax","Luke Seith","Luke LaValle","William Oppold",
"Luke Strang","Saahil Kapur","Kamran Alizadeh","Andy Heffernan","Oliver Achecar","Joshua Yi",
"Sidney Were","Immanuel Hanna","Ari Kyriacou","Zaki Arfin","Aditya Singh","Sam Hines-Mudry",
"Eric Rodas Chacon","Drew Campelli","Lawrence Zhang"];
const STAFF = ["Mr. Ward","Murphy","Mr. Divan","Mr. Adorno","Ms. Pabon"];

const TOPICS = [
  {id:1, name:'Position & reference points', short:'Position'},
  {id:2, name:'Distance & displacement', short:'Distance/Displacement'},
  {id:3, name:'Scalars & vectors', short:'Scalars/Vectors'},
  {id:4, name:'Speed & velocity math', short:'Speed math'},
  {id:5, name:'Average speed vs. average velocity', short:'Avg speed/velocity'},
  {id:6, name:'Position-time graphs', short:'Position graphs'},
  {id:7, name:'Velocity-time graphs', short:'Velocity graphs'},
  {id:8, name:'Acceleration math', short:'Acceleration math'},
  {id:9, name:'Acceleration ideas', short:'Acceleration ideas'},
  {id:10, name:'Graph matching', short:'Graph matching'}
];

/* ---------- helpers ---------- */
const R = (a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick = a=>a[Math.floor(Math.random()*a.length)];
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]];} return a; }
const isHalf = x => Math.abs(x*2-Math.round(x*2))<1e-9;
const isInt = x => Math.abs(x-Math.round(x))<1e-9;
function fmt(n){ n=Math.round(n*100)/100; return String(n).replace('-','\u2212'); }
function sgn(n){ return n>0 ? '+'+fmt(n) : fmt(n); }
const DIRS = ['north','south','east','west'];

let _used = [];
function resetNames(){ _used = []; }
function name(){
  let n, first, guard=0;
  do {
    n = Math.random()<0.2 ? pick(STAFF) : pick(STUDENTS);
    first = n.split(' ')[0]; if(n.startsWith('Mr.')||n.startsWith('Ms.')) first = n;
    guard++;
  } while(_used.includes(first) && guard<200);
  _used.push(first); return first;
}

/* MC builder: items may be strings or {t, svg} */
function mc(base, correct, wrongs){
  const norm = x => typeof x==='string' ? {t:x} : x;
  const items = [Object.assign(norm(correct),{ok:true})].concat(wrongs.map(w=>Object.assign(norm(w),{ok:false})));
  const sh = shuffle(items);
  return Object.assign({type:'mc', choices: sh.map(x=>({t:x.t||'', svg:x.svg||null})), correct: sh.findIndex(x=>x.ok)}, base);
}
function num(base, answer, unit){ return Object.assign({type:'num', answer, unit:unit||''}, base); }

/* ---------- graph drawing ---------- */
const INK='#16213a', BLUE='#2f6fed', ORANGE='#e8751a', GRID='#d5e0ec';
function graphSVG(o){
  const W=o.w||560, H=o.h||300, ml=54, mr=18, mt=14, mb=44;
  const pw=W-ml-mr, ph=H-mt-mb, xmax=o.xmax, ymin=o.ymin, ymax=o.ymax;
  const X=x=>ml+x/xmax*pw, Y=y=>mt+(ymax-y)/(ymax-ymin)*ph;
  const xl = xmax>10?2:1, yl = (ymax-ymin)>10?2:1;
  let s=`<svg class="graph" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.alt||'graph'}" xmlns="http://www.w3.org/2000/svg">`;
  s+=`<rect x="${ml}" y="${mt}" width="${pw}" height="${ph}" fill="#fff"/>`;
  for(let x=0;x<=xmax;x++) s+=`<line x1="${X(x)}" y1="${mt}" x2="${X(x)}" y2="${mt+ph}" stroke="${GRID}" stroke-width="1"/>`;
  for(let y=Math.ceil(ymin);y<=ymax;y++) s+=`<line x1="${ml}" y1="${Y(y)}" x2="${ml+pw}" y2="${Y(y)}" stroke="${GRID}" stroke-width="1"/>`;
  if(ymin<0 && ymax>0) s+=`<line x1="${ml}" y1="${Y(0)}" x2="${ml+pw}" y2="${Y(0)}" stroke="${INK}" stroke-width="2"/>`;
  s+=`<line x1="${ml}" y1="${mt}" x2="${ml}" y2="${mt+ph}" stroke="${INK}" stroke-width="2.5"/>`;
  s+=`<line x1="${ml}" y1="${Y(ymin)}" x2="${ml+pw}" y2="${Y(ymin)}" stroke="${INK}" stroke-width="2.5"/>`;
  for(let x=0;x<=xmax;x+=xl) s+=`<text x="${X(x)}" y="${mt+ph+16}" text-anchor="middle" font-size="12" fill="${INK}">${x}</text>`;
  for(let y=Math.ceil(ymin);y<=ymax;y++) if(y%yl===0) s+=`<text x="${ml-7}" y="${Y(y)+4}" text-anchor="end" font-size="12" fill="${INK}">${fmt(y)}</text>`;
  s+=`<text x="${ml+pw/2}" y="${H-6}" text-anchor="middle" font-size="13" font-weight="700" fill="${INK}">Time (s)</text>`;
  s+=`<text transform="translate(13 ${mt+ph/2}) rotate(-90)" text-anchor="middle" font-size="13" font-weight="700" fill="${INK}">${o.ylabel}</text>`;
  (o.lines||[]).forEach(L=>{
    const pts=L.pts.map(p=>`${X(p[0])},${Y(p[1])}`).join(' ');
    s+=`<polyline points="${pts}" fill="none" stroke="${L.color||BLUE}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(L.dots) L.pts.forEach(p=>{ s+=`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="4.5" fill="${L.color||BLUE}"/>`; });
    if(L.label){ const e=L.pts[L.pts.length-1]; s+=`<text x="${X(e[0])-6}" y="${Y(e[1])-9}" text-anchor="end" font-size="14" font-weight="800" fill="${L.color||BLUE}">${L.label}</text>`; }
  });
  return s+'</svg>';
}
function ptGraph(g, alt){
  const ys=g.pts.map(p=>p[1]); const mn=Math.min(...ys), mx=Math.max(...ys);
  return graphSVG({xmax:g.T, ymin: mn<0? Math.floor(mn)-1 : 0, ymax: Math.max(1,Math.ceil(mx)+1), ylabel:'Position (m)', alt:alt||'position-time graph', lines:[{pts:g.pts, dots:true}]});
}
function vtGraph(g, alt){
  const ys=g.pts.map(p=>p[1]); const mn=Math.min(...ys), mx=Math.max(...ys);
  return graphSVG({xmax:g.T, ymin: mn<0? Math.floor(mn)-1 : -2, ymax: mx>0? Math.ceil(mx)+1 : 2, ylabel:'Velocity (m/s)', alt:alt||'velocity-time graph', lines:[{pts:g.pts, dots:true}]});
}
/* small sketch graphs (no numbers) for matching questions */
function miniSVG(pts, o){
  o=o||{}; const W=o.w||140, H=o.h||108, L=16, T=10, B=8, Rr=10;
  const X=x=>L+x*(W-L-Rr), Y=y=>T+(1-(y+1)/2)*(H-T-B);
  let s=`<svg class="mini" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.alt||'sketch graph'}" xmlns="http://www.w3.org/2000/svg">`;
  s+=`<rect x="${L}" y="${T}" width="${W-L-Rr}" height="${H-T-B}" fill="#fff" stroke="${GRID}"/>`;
  s+=`<line x1="${L}" y1="${T}" x2="${L}" y2="${H-B}" stroke="${INK}" stroke-width="2"/>`;
  s+=`<line x1="${L}" y1="${Y(0)}" x2="${W-Rr}" y2="${Y(0)}" stroke="${INK}" stroke-width="2"/>`;
  s+=`<text x="${L-4}" y="${T+9}" text-anchor="end" font-size="11" font-weight="700" fill="${INK}">+</text>`;
  s+=`<text x="${L-4}" y="${H-B}" text-anchor="end" font-size="11" font-weight="700" fill="${INK}">\u2212</text>`;
  s+=`<text x="${W-Rr}" y="${Y(0)+13}" text-anchor="end" font-size="10" fill="${INK}">time</text>`;
  s+=`<polyline points="${pts.map(p=>X(p[0])+','+Y(p[1])).join(' ')}" fill="none" stroke="${BLUE}" stroke-width="3.5" stroke-linejoin="round" stroke-linecap="round"/>`;
  return s+'</svg>';
}
const curve = f => { const a=[]; for(let i=0;i<=10;i++){ const t=i/10; a.push([t,f(t)]);} return a; };

/* ---------- registry ---------- */
const G = {};
function reg(t,diff,id,fn){ (G[t]=G[t]||[]).push({t,diff,id,fn}); }

/* =====================  TOPIC 1: POSITION & REFERENCE POINTS  ===================== */
const OBJS=['locker','water fountain','bench','trash can','bike rack','vending machine'];
const PLACES=['gym doors','front office','cafeteria door','library desk','flagpole','main entrance'];

reg(1,1,'ref-which',()=>{
  const N=name(), obj=pick(OBJS), place=pick(PLACES), d=R(3,25), dir=pick(DIRS);
  return mc({
    stem:`${N} says the ${obj} is ${d} m ${dir} of the ${place}. In that description, what is the <b>reference point</b>?`,
    hints:['A reference point is the starting spot you measure <i>from</i>.','Look for the place the distance and direction are measured from. It usually comes after the word "of."',`The words "${d} m ${dir} <i>of the ${place}</i>" tell you what the distance is measured from.`],
    steps:[`The distance (${d} m) and direction (${dir}) are measured <i>from</i> the ${place}.`,`So the reference point is <b>the ${place}</b>.`]
  }, `the ${place}`, [`the ${obj}`, `${d} m`, dir]);
});
reg(1,1,'ref-complete',()=>{
  const N=name(), obj=pick(OBJS), place=pick(PLACES), d=R(3,25), dir=pick(DIRS);
  return mc({
    stem:`${N} says, "Meet me at the ${obj}!" Which description tells you <i>exactly</i> where the ${obj} is?`,
    hints:['A complete position needs three things.','The three things are a distance, a direction, and a reference point.',`Look for the choice with a number, a direction, and a place to measure from.`],
    steps:['A full position description needs a <b>distance</b>, a <b>direction</b>, and a <b>reference point</b>.',`Only "${d} m ${dir} of the ${place}" has all three.`]

/* =====================  TOPIC 6: POSITION-TIME GRAPHS  ===================== */
function genPT(){
  for(let tries=0;tries<500;tries++){
    const kinds=shuffle(['up','flat','down']);
    const mags=shuffle([0.5,1,1.5,2,3]).slice(0,2); let mi=0;
    const x0=R(-2,4), pts=[[0,x0]], segs=[]; let t=0,x=x0;
    for(const k of kinds){
      const d=pick([2,4]); let sl=0; if(k==='up') sl=mags[mi++]; else if(k==='down') sl=-mags[mi++];
      const nx=x+sl*d; segs.push({t0:t,t1:t+d,x0:x,x1:nx,slope:sl,kind:k}); t+=d; pts.push([t,nx]); x=nx;
    }
    const ys=pts.map(p=>p[1]); if(Math.max(...ys)>9||Math.min(...ys)<-6) continue;
    return {pts,segs,T:t};
  }
}
const ivl = s => `${s.t0}\u2013${s.t1} s`;

function genVT(sign, needDiff){
  for(;;){
    const v1=pick([4,6,8,10]), d1=pick([2,4]), d2=pick([2,4]), d3=pick([2,4]), d4=pick([2,4]);
    if(needDiff && d1===d3) continue;
    const s=sign||1, T=d1+d2+d3+d4;
    const pts=[[0,0],[d1,s*v1],[d1+d2,s*v1],[d1+d2+d3,0],[T,0]];
    const segs=[{k:'up',t0:0,t1:d1,a:s*v1/d1},{k:'flat',t0:d1,t1:d1+d2,a:0,v:s*v1},{k:'down',t0:d1+d2,t1:d1+d2+d3,a:-s*v1/d3},{k:'rest',t0:d1+d2+d3,t1:T,a:0,v:0}];
    return {pts,segs,T,v1:s*v1};
  }
}

/* ---------- public API ---------- */
function build(g){
  for(let i=0;i<60;i++){
    resetNames();
    let q; try{ q=g.fn(); }catch(e){ q=null; }
    if(q){ q.topic=g.t; q.diff=g.diff; q.tid=g.id; if(KINDS[g.id]) q.kind=KINDS[g.id]; return q; }
  }
  throw new Error('generator failed: '+g.id);
}
function makeQuestion(t, lvl, avoid, kinds){
  avoid=avoid||[]; let list=G[t];
  if(t===8 && kinds && kinds.length && kinds.length<3) list=list.filter(g=>kinds.includes(KINDS[g.id]));
  let pool=list.filter(g=>g.diff===lvl && !avoid.includes(g.id));
  if(!pool.length) pool=list.filter(g=>g.diff===lvl);
  if(!pool.length){
    const ds=[...new Set(list.map(g=>g.diff))].sort((a,b)=>Math.abs(a-lvl)-Math.abs(b-lvl));
    pool=list.filter(g=>g.diff===ds[0]);
  }
  return build(pick(pool));
}
function makeSimilar(q){
  const g=G[q.topic].find(x=>x.id===q.tid); let n;
  for(let i=0;i<10;i++){ n=build(g); if(n.stem!==q.stem) return n; }
  return n;
}

/* ---------- progress code ---------- */
const B32='0123456789ABCDEFGHJKMNPQRSTVWXYZ';
function encodeProgress(S){
  const bytes=[0x10 | (S.pre?1:0)];
  TOPICS.forEach(t=>{
    const T=S.topics[t.id];
    const m4 = T.m==null ? 0 : 1+Math.round(Math.max(0,Math.min(1,T.m))*14);
    bytes.push((m4<<4) | ((Math.max(1,Math.min(3,T.lvl))-1)<<2) | Math.max(0,Math.min(3,T.blind)));
  });
  let sum=0; bytes.forEach((b,i)=>{ sum=(sum+b*(i+7))&255; }); bytes.push(sum);
  let bits='', out='';
  bytes.forEach(b=>{ bits+=b.toString(2).padStart(8,'0'); });
  while(bits.length%5) bits+='0';
  for(let i=0;i<bits.length;i+=5) out+=B32[parseInt(bits.slice(i,i+5),2)];
  return 'KIN-'+out.match(/.{1,5}/g).join('-');
}
function decodeProgress(str){
  try{
    let s=String(str).toUpperCase().replace(/[^0-9A-Z]/g,'');
    if(s.startsWith('KIN')) s=s.slice(3);
    s=s.replace(/O/g,'0').replace(/[IL]/g,'1').replace(/U/g,'V');
    let bits=''; for(const ch of s){ const i=B32.indexOf(ch); if(i<0) return null; bits+=i.toString(2).padStart(5,'0'); }
    const n=TOPICS.length+2, bytes=[];
    if(bits.length<n*8) return null;
    for(let i=0;i<n;i++) bytes.push(parseInt(bits.slice(i*8,i*8+8),2));
    if((bytes[0]>>4)!==1) return null;
    let sum=0; for(let i=0;i<n-1;i++) sum=(sum+bytes[i]*(i+7))&255;
    if(sum!==bytes[n-1]) return null;
    const topics={};
    TOPICS.forEach((t,i)=>{ const b=bytes[i+1], m4=b>>4;
      topics[t.id]={m: m4===0?null:(m4-1)/14, lvl:((b>>2)&3)+1, streak:0, blind:b&3, n: m4===0?0:1};
      if(topics[t.id].lvl>3) topics[t.id].lvl=3; });
    return {topics, pre:!!(bytes[0]&1), answered:0, correct:0};
  }catch(e){ return null; }
}

/* ---------- mastery model ---------- */
function status(T){
  if(T.m==null) return {k:'new',label:'Not started'};
  if(T.m>=0.8) return {k:'ready',label:'Ready'};
  if(T.m>=0.5) return {k:'almost',label:'Almost there'};
  return {k:'needs',label:'Needs practice'};
}
function scoreOf(o){
  if(o.kind==='skip') return {s:0,w:0.4};
  if(o.kind==='show') return {s:0,w:0.6};
  if(o.correct){ const base=[0,0.6,0.85,1][o.conf]*[1,0.8,0.6,0.4][Math.min(o.hints,3)]; return {s:base,w:1}; }
  return {s:[0,0.15,0.05,0][o.conf],w:1};
}
function record(q,o,mode){
  const T=S.topics[q.topic], {s,w}=scoreOf(o); let levelMsg='';
  T.m = T.m==null ? s : T.m + 0.4*w*(s-T.m);
  T.n++;
  S.answered++; if(o.kind==='answer'&&o.correct) S.correct++;
  if(o.kind==='answer' && !o.correct && o.conf===3) T.blind=Math.min(3,T.blind+1);
  if(o.kind==='answer' && o.correct && o.conf>=2 && o.hints===0 && T.blind>0) T.blind--;
  if(mode!=='pre'){
    const good = o.kind==='answer' && o.correct && o.conf>=2 && o.hints===0;
    if(good){ T.streak = T.streak>0 ? T.streak+1 : 1; if(T.streak>=2 && T.lvl<3){ T.lvl++; T.streak=0; levelMsg='Level up in '+TOPICS[q.topic-1].name+'! Questions here will get harder.'; } }
    else { T.streak = T.streak<0 ? T.streak-1 : -1; if(T.streak<=-2 && T.lvl>1){ T.lvl--; T.streak=0; levelMsg='Let\'s build this one up again. Questions will be a bit easier for now.'; } }
  }
  save();
  return {levelMsg};
}

}
function progressScreen(){
  const blind=TOPICS.filter(t=>S.topics[t.id].blind>0).map(t=>t.name);
  return `<h1 class="h1s">My progress</h1>
  <div class="card lanes">${TOPICS.map(t=>lane(t.id)).join('')}</div>
  ${blind.length?`<div class="card note"><b>Blind spots:</b> you felt sure about answers in <b>${blind.join(', ')}</b> that turned out wrong. Practice these first.</div>`:''}
  <p class="muted center">${S.answered} questions answered so far.</p>
  <div class="row center"><button class="btn primary" data-act="weakest">Practice my weakest topics</button><button class="btn" data-act="home">Home</button></div>
  ${codeBox()}${loadBox()}`;
}

function qScreen(){
  const s=ui.sess, c=s.cur, q=c.q, T=TOPICS[q.topic-1], pre=s.mode==='pre';
  const lvl=['','Warm-up','Core','Challenge'][q.diff], dots='\u25CF'.repeat(q.diff)+'\u25CB'.repeat(3-q.diff);
  const locked = c.stage!=='answering';
  let counter;
  if(pre) counter=`Question ${s.idx+1} of ${s.queue.length}`;
  else counter=`${s.count} answered \u00B7 ${s.right} correct`;
  const progress = pre ? `<div class="bar"><div style="width:${Math.round(s.idx/s.queue.length*100)}%"></div></div>` : '';

  let answer='';
  if(q.type==='mc'){
    answer=`<div class="opts" role="radiogroup" aria-label="Answer choices">`+q.choices.map((ch,i)=>{
      let cls='opt'; if(c.stage==='done'&&c.kind==='answer'){ if(i===q.correct) cls+=' right'; else if(i===c.picked) cls+=' wrong'; } else if(c.stage==='done'&&c.kind==='show'&&i===q.correct) cls+=' right';
      return `<label class="${cls}${ch.svg?' hasimg':''}"><input type="radio" name="opt" value="${i}" ${c.picked===i?'checked':''} ${locked?'disabled':''}><span class="key">${'ABCD'[i]}</span><span class="optbody">${ch.t}${ch.svg||''}</span></label>`;
    }).join('')+`</div>`;
  } else {
    answer=`<div class="numrow"><input id="num" type="text" inputmode="decimal" autocomplete="off" spellcheck="false" value="${esc(c.value)}" placeholder="Answer" aria-label="Your answer" ${locked?'disabled':''}><span class="unit">${q.unit}</span></div>
    <p class="note">${c.err?`<span class="err">${c.err}</span>`:'Answers are whole numbers or end in .5. Use a minus sign for negatives.'}</p>`;
  }

  const hintLabels=['Hint 1: a nudge','Hint 2: the setup','Hint 3: almost there'];
  const hintsHtml = c.hints>0 ? `<div class="hints">${q.hints.slice(0,c.hints).map((h,i)=>`<div class="hint"><b>${hintLabels[i]}</b><br>${h}</div>`).join('')}</div>` : '';

  let actions='', feedback='';
  if(c.stage==='answering'){
    actions=`<div class="row actions"><button class="btn primary" data-act="check" ${(q.type==='mc'?c.picked!=null:c.value.trim()!=='')?'':'disabled'}>Check answer</button>
      ${!pre&&c.hints<3?`<button class="btn" data-act="hint">Hint (${c.hints}/3)</button>`:''}
      <button class="btn" data-act="show">Show me how</button><button class="btn ghost" data-act="skip">Skip</button></div>`;
  } else if(c.stage==='conf'){
    actions=`<div class="conf" role="group" aria-label="How sure are you?"><p><b>How sure are you that your answer is right?</b><br><span class="muted">Be honest. This helps pick your next question.</span></p>
      <div class="row"><button class="btn" data-act="conf" data-c="1">Just guessing</button><button class="btn" data-act="conf" data-c="2">Pretty sure</button><button class="btn" data-act="conf" data-c="3">Totally sure</button></div>
      <button class="linkbtn" data-act="edit">Change my answer</button></div>`;
  } else {
    const steps=`<div class="steps"><b>How it is solved</b><ol>${q.steps.map(x=>`<li>${x}</li>`).join('')}</ol></div>`;
    const ansTxt = q.type==='num' ? `${fmt(q.answer)} ${q.unit}` : '';
    if(c.kind==='show'){
      feedback=`<div class="fb show" aria-live="polite"><p><b>Here is how it works.</b>${q.type==='num'?` The answer is <b>${ansTxt}</b>.`:''} Read it through, then try a similar one to see if it sticks.</p>${steps}</div>`;
    } else if(c.correct){
      const m = c.conf===1 ? 'Correct! You said you were guessing, so that is a good sign. Check the steps to make sure you know why.' : pick(['Correct! Nice work.','Yes, that is right!','Got it!','Right on.']);
      feedback=`<div class="fb good" aria-live="polite"><p><b>${m}</b></p>${c.showSteps?steps:''}</div>`;
    } else {
      const extra = c.conf===3 ? ' You felt totally sure, so this one is a <b>blind spot</b>. Look at the steps closely.' : '';
      feedback=`<div class="fb bad" aria-live="polite"><p><b>Not quite.</b>${q.type==='num'?` The answer is <b>${ansTxt}</b>.`:''}${extra}</p>${steps}</div>`;
    }
    if(c.levelMsg) feedback+=`<div class="levelmsg">${c.levelMsg}</div>`;
    const last = pre && s.idx>=s.queue.length-1;
    actions=`<div class="row actions"><button class="btn primary" data-act="next">${last?'See my results':'Next question'}</button>
      ${(c.kind==='show'||!c.correct)?`<button class="btn" data-act="similar">Try a similar one</button>`:''}
      ${(c.kind==='answer'&&c.correct&&!c.showSteps)?`<button class="btn ghost" data-act="steps">See how it is solved</button>`:''}</div>`;
  }
  const footer = pre ? `<p class="muted center">Pre-test: no hints here. You can still skip a question or tap "Show me how" any time.</p>` : `<div class="row center"><button class="btn ghost" data-act="finish">Finish session</button></div>`;
  return `<div class="qhead"><span class="chip">${T.name}</span><span class="lvl" title="Difficulty">${dots} ${lvl}</span>${q.kind?`<span class="kindtag">${KIND_LABEL[q.kind]}</span>`:''}<span class="counter">${counter}</span></div>${progress}
  <article class="card q"><div class="stem">${q.stem}</div>${q.svg?`<div class="gwrap">${q.svg}</div>`:''}${answer}${hintsHtml}${actions}${feedback}</article>${(!pre&&s.topics.includes(8))?kindFilter():''}${footer}`;
}

const screens = {home:homeScreen, topics:topicsScreen, plan:planScreen, progress:progressScreen, q:qScreen};

/* ---------- sessions ---------- */
function newCur(q){ return {q, hints:0, picked:null, value:'', stage:'answering', correct:null, conf:null, kind:null, showSteps:false, levelMsg:'', err:''}; }
function startPretest(per){
  const items=[]; TOPICS.forEach(t=>{ for(let k=1;k<=per;k++) items.push({topic:t.id,lvl:k}); });
  const queue=[]; for(let l=1;l<=per;l++) queue.push(...shuffle(items.filter(i=>i.lvl===l)));
  ui.sess={mode:'pre', queue, idx:0, count:0, right:0, used:{}, recent:[], results:{}};
  loadPreQuestion(); ui.screen='q'; render(true);
}
function loadPreQuestion(){
  const s=ui.sess, it=s.queue[s.idx]; const used=s.used[it.topic]=s.used[it.topic]||[];
  const q=makeQuestion(it.topic,it.lvl,used); used.push(q.tid); s.cur=newCur(q);
}
function startPractice(topics){
  ui.sess={mode:'practice', topics:topics.slice(), count:0, right:0, recent:[], lastTopic:null};
  loadPracticeQuestion(); ui.screen='q'; render(true);
}
function loadPracticeQuestion(){
  const s=ui.sess;
  const ws=s.topics.map(id=>{ const T=S.topics[id]; let w=T.m==null?0.9:(1-T.m)+0.1; w+=0.35*T.blind; if(id===s.lastTopic&&s.topics.length>1) w*=0.35; return Math.max(w,0.05); });
  let r=Math.random()*ws.reduce((a,b)=>a+b,0), id=s.topics[0];
  for(let i=0;i<ws.length;i++){ r-=ws[i]; if(r<=0){ id=s.topics[i]; break; } }
  const q=makeQuestion(id,S.topics[id].lvl,s.recent.slice(-3), id===8?[...ui.kinds]:null); s.recent.push(q.tid); s.lastTopic=id; s.cur=newCur(q);
}
function weakestTopics(n){
  return TOPICS.slice().sort((a,b)=>{ const A=S.topics[a.id],B=S.topics[b.id]; return ((A.m??-0.5)-0.2*A.blind)-((B.m??-0.5)-0.2*B.blind); }).slice(0,n).map(t=>t.id);
}
function finishPretest(){
  const s=ui.sess;
  TOPICS.forEach(t=>{ const r=(s.results[t.id]||[]).filter(x=>x.ok).map(x=>x.diff); const T=S.topics[t.id];
    T.lvl = r.length ? Math.min(3, Math.max(...r)+1) : 1; T.streak=0; });
  S.pre=true; save();
  const sorted=TOPICS.slice().sort((a,b)=>(S.topics[a.id].m??-1)-(S.topics[b.id].m??-1)).filter(t=>(S.topics[t.id].m??0)<0.8);
  ui.sel=new Set((sorted.length?sorted.slice(0,4):TOPICS.slice(0,0)).map(t=>t.id));
  ui.screen='plan'; ui.sess=null; render(true);
}
function isCorrectNow(){
  const c=ui.sess.cur,q=c.q; if(q.type==='mc') return c.picked===q.correct;
  return Math.abs(parseNum(c.value)-q.answer)<0.011;
}
function parseNum(s){
  s=String(s).replace(/\u2212/g,'-').replace(/[\s,]/g,'').replace(/[a-zA-Z/\u00b2\u00B2]+$/,'');
  if(!/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s)) return null; return parseFloat(s);
}
function finalize(kind,conf){
  const s=ui.sess,c=s.cur,q=c.q; let correct=null;
  if(kind==='answer') correct=isCorrectNow();
  c.correct=correct; c.conf=conf||0; c.kind=kind; c.stage='done';
  const res=record(q,{kind,correct,conf:conf||1,hints:c.hints},s.mode);
  c.levelMsg=res.levelMsg; s.count++; if(correct) s.right++;
  if(s.mode==='pre'){ (s.results[q.topic]=s.results[q.topic]||[]).push({diff:q.diff, ok: kind==='answer'&&correct&&conf>=2}); }
}
function nextQ(){
  const s=ui.sess;
  if(s.mode==='pre'){ s.idx++; if(s.idx>=s.queue.length){ finishPretest(); return; } loadPreQuestion(); }
  else loadPracticeQuestion();
  render(true);
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b) return; const a=b.dataset.act, s=ui.sess, c=s&&s.cur;
  switch(a){
    case 'home': ui.screen='home'; ui.sess=null; render(true); break;
    case 'progress': ui.screen='progress'; ui.sess=null; render(true); break;
    case 'pretest': startPretest(+b.dataset.n); break;
    case 'topics': ui.sel=new Set(); ui.screen='topics'; render(true); break;
    case 'mixed': startPractice(TOPICS.map(t=>t.id)); break;
    case 'weakest': startPractice(weakestTopics(3)); break;
    case 'startsel': if(ui.sel.size) startPractice([...ui.sel]); break;
    case 'selall': ui.sel=new Set(TOPICS.map(t=>t.id)); render(); break;
    case 'selweak': ui.sel=new Set(weakestTopics(3)); render(); break;
    case 'finish': ui.screen='progress'; ui.sess=null; render(true); break;
    case 'check':
      if(c.q.type==='num'){ const v=parseNum(c.value); if(v==null){ c.err='Enter just a number (the unit is already shown), like 12, \u22123, or 4.5.'; render(); break; } }
      c.err=''; c.stage='conf'; render(); break;
    case 'edit': c.stage='answering'; render(); break;
    case 'conf': finalize('answer',+b.dataset.c); render(); break;
    case 'hint': if(c.hints<3) c.hints++; render(); break;
    case 'show': finalize('show',0); render(); break;
    case 'skip': finalize('skip',0); nextQ(); break;
    case 'steps': c.showSteps=true; render(); break;
    case 'next': nextQ(); break;
    case 'similar': s.cur=newCur(makeSimilar(c.q)); render(true); break;
    case 'copycode': copyText(encodeProgress(S),'Code copied!'); break;
    case 'copysum': copyText(summaryText(),'Summary copied!'); break;
    case 'loadcode': {
      const v=document.getElementById('codein').value, d=decodeProgress(v);
      if(!d){ ui.codeMsg='That code did not work. Check for typos and try again.'; const m=document.getElementById('codemsg'); if(m) m.textContent=ui.codeMsg; break; }
      S=d; save(); ui.codeMsg='';
      const sorted=TOPICS.slice().sort((x,y)=>(S.topics[x.id].m??-1)-(S.topics[y.id].m??-1)).filter(t=>(S.topics[t.id].m??0)<0.8);
      ui.sel=new Set(sorted.slice(0,4).map(t=>t.id)); ui.screen='plan'; ui.sess=null; render(true); toast('Progress loaded!'); break; }
    case 'calc': ui.calcOpen=!ui.calcOpen; renderCalc(); break;
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.name==='opt'&&ui.sess){ ui.sess.cur.picked=+t.value; render(); const el=document.querySelector('[data-act="check"]'); if(el) el.focus(); }
  if(t.dataset&&t.dataset.kind){
    const k=t.dataset.kind; if(t.checked) ui.kinds.add(k); else if(ui.kinds.size>1) ui.kinds.delete(k); else toast('Keep at least one type checked.');
    render(); return; }
  if(t.dataset&&t.dataset.topic){ const id=+t.dataset.topic; if(t.checked) ui.sel.add(id); else ui.sel.delete(id); render(); }
});
document.addEventListener('input',e=>{
  if(e.target.id==='num'&&ui.sess){ const c=ui.sess.cur; c.value=e.target.value; c.err=''; const btn=document.querySelector('[data-act="check"]'); if(btn) btn.disabled=c.value.trim()===''; }
});
document.addEventListener('keydown',e=>{
  if(e.target.id==='num'&&e.key==='Enter'&&ui.sess&&ui.sess.cur.stage==='answering'&&ui.sess.cur.value.trim()!==''){ e.preventDefault(); document.querySelector('[data-act="check"]').click(); }
  if(e.target.id==='codein'&&e.key==='Enter'){ e.preventDefault(); document.querySelector('[data-act="loadcode"]').click(); }
});

/* ---------- render ---------- */
function render(scrollTop){
  const keepCode = document.getElementById('codein') ? document.getElementById('codein').value : '';
  $app.innerHTML = screens[ui.screen]();
  const ci=document.getElementById('codein'); if(ci&&keepCode) ci.value=keepCode;
  if(scrollTop) window.scrollTo(0,0);
  if(ui.screen==='q'){ const n=document.getElementById('num'); if(n&&!n.disabled) n.focus({preventScroll:true}); }
}

/* ---------- calculator ---------- */
const calc={cur:'0',prev:null,op:null,fresh:true,expr:''};
function calcFmt(n){ if(!isFinite(n)) return 'Error'; return String(+n.toFixed(8)); }
function calcCompute(a,b,op){ return op==='+'?a+b : op==='\u2212'?a-b : op==='\u00d7'?a*b : (b===0?NaN:a/b); }
function calcPress(k){
  if(calc.cur==='Error'&&k!=='C'){ return; }
  if(/^[0-9]$/.test(k)){ if(calc.fresh){ calc.cur=k; calc.fresh=false; } else if(calc.cur.replace(/[-.]/g,'').length<12) calc.cur = calc.cur==='0'?k:calc.cur+k; }
  else if(k==='.'){ if(calc.fresh){ calc.cur='0.'; calc.fresh=false; } else if(!calc.cur.includes('.')) calc.cur+='.'; }
  else if(['+','\u2212','\u00d7','\u00f7'].includes(k)){
    if(calc.op&&!calc.fresh){ calc.cur=calcFmt(calcCompute(calc.prev,parseFloat(calc.cur),calc.op)); }
    calc.prev=parseFloat(calc.cur); calc.op=k; calc.fresh=true; calc.expr=calc.cur+' '+k;
  }
  else if(k==='='){ if(calc.op!=null){ const r=calcCompute(calc.prev,parseFloat(calc.cur),calc.op); calc.expr=calc.cur===''?'':calc.prev+' '+calc.op+' '+calc.cur+' ='; calc.cur=calcFmt(r); calc.op=null; calc.prev=null; calc.fresh=true; } }
  else if(k==='C'){ calc.cur='0'; calc.prev=null; calc.op=null; calc.fresh=true; calc.expr=''; }
  else if(k==='\u232B'){ if(!calc.fresh&&calc.cur.length>1) calc.cur=calc.cur.slice(0,-1); else { calc.cur='0'; calc.fresh=true; } if(calc.cur==='-') calc.cur='0'; }
  else if(k==='\u00b1'){ if(calc.cur!=='0'){ calc.cur=calc.cur.startsWith('-')?calc.cur.slice(1):'-'+calc.cur; } }
  const d=document.getElementById('calcdisp'), x=document.getElementById('calcexpr');
  if(d) d.textContent=calc.cur.replace('-','\u2212'); if(x) x.textContent=calc.expr.replace('-','\u2212');
}
function renderCalc(){
  const el=document.getElementById('calc'); el.hidden=!ui.calcOpen; document.body.classList.toggle('calc-open',ui.calcOpen);
  const tb=document.getElementById('calcbtn'); tb.setAttribute('aria-expanded',ui.calcOpen);
  if(ui.calcOpen&&!el.dataset.built){
    const keys=['C','\u00b1','\u232B','\u00f7','7','8','9','\u00d7','4','5','6','\u2212','1','2','3','+','0','.','='];
    el.innerHTML=`<div class="calc-top"><b>Calculator</b><button class="calc-x" data-act="calc" aria-label="Close calculator">\u00d7</button></div><div class="calc-expr" id="calcexpr"></div><div class="calc-disp" id="calcdisp" aria-live="polite">0</div><div class="calc-keys">`+keys.map(k=>`<button class="ck ${/[\u00f7\u00d7\u2212+]/.test(k)?'op':''} ${k==='='?'eq':''} ${k==='0'?'zero':''}" data-k="${k}">${k}</button>`).join('')+`</div>`;
    el.addEventListener('click',e=>{ const k=e.target.closest('[data-k]'); if(k) calcPress(k.dataset.k); });
    el.dataset.built='1';
  }
}
document.getElementById('calcbtn').addEventListener('click',()=>{ ui.calcOpen=!ui.calcOpen; renderCalc(); });
document.getElementById('progbtn').addEventListener('click',()=>{ ui.screen='progress'; ui.sess=null; render(true); });
document.getElementById('brand').addEventListener('click',()=>{ ui.screen='home'; ui.sess=null; render(true); });

render();

</script>
</body>
